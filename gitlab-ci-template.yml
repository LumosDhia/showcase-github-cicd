# Copy this file to the root of your GitLab repository as `.gitlab-ci.yml`.
# Stage names must stay exactly as listed below — the dashboard's infinity
# loop maps each pipeline job to a loop node by `stage` name.

stages:
  - plan
  - code
  - build
  - test
  - release
  - deploy

plan:
  stage: plan
  image: alpine:3.20
  script:
    - echo "Resolving pipeline graph"
    - echo "6 stages · plan, code, build, test, release, deploy"

code:
  stage: code
  image: node:20-alpine
  script:
    - echo "Running static analysis"
    - test -f site/index.html && echo "site/index.html present"

build:
  stage: build
  image: node:20-alpine
  script:
    - echo "Building project"
    - mkdir -p public && cp site/index.html public/index.html

test:
  stage: test
  image: node:20-alpine
  script:
    - echo "Running tests"
    - test -s public/index.html

release:
  stage: release
  image: alpine:3.20
  script:
    - echo "Creating release $CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "Deploying site/index.html"
    - echo "Live at https://example.com"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
