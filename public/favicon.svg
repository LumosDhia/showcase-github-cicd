<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- macOS Top Dots -->
  <circle cx="12" cy="10" r="2.5" fill="#ff5f57"/>
  <circle cx="19" cy="10" r="2.5" fill="#febc2e"/>
  <circle cx="26" cy="10" r="2.5" fill="#28c840"/>

  <!-- DevOps Infinity Loop Path -->
  <path d="M22 38 C14 38 14 26 22 26 C30 26 34 38 42 38 C50 38 50 26 42 26 C34 26 30 38 22 38 Z" 
        fill="none" 
        stroke="url(#devopsGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Active Pipeline Nodes -->
  <circle cx="22" cy="26" r="3" fill="#38bdf8" />
  <circle cx="42" cy="38" r="3" fill="#22c55e" />
</svg>
